[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hacktx-backend"
version = "0.1.0"
description = "core api: ingest, persist, broadcast and read endpoints"
requires-python = ">=3.11"
dependencies = [
  "hacktx-contracts",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "redis>=5.0",
  "asyncpg>=0.29",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "fakeredis>=2.26",
  "jsonschema[format]>=4.22",
  "pytest-timeout>=2.3",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 60
