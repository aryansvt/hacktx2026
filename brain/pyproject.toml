[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hacktx-brain"
version = "0.1.0"
description = "enrichment worker: raw trap events in, public events out"
requires-python = ">=3.11"
dependencies = [
  "hacktx-contracts",
  "redis>=5,<9",
  "geoip2>=4.8",
  "httpx>=0.27",
  "anthropic>=2.3",
  "asyncpg>=0.29",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "fakeredis>=2.26",
  "jsonschema[format]>=4.22",
]

[tool.setuptools]
packages = ["brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
